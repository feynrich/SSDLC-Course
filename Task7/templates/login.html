{% extends "base.html" %}
{% block title %}Вход - Библиотека{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <h1>Вход в систему</h1>
        <p class="login-subtitle">Система управления библиотекой</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Логин (пользователь БД)</label>
                <input type="text" id="username" name="username"
                       placeholder="library_user" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password"
                       placeholder="Введите пароль" required>
            </div>

            <details class="db-settings">
                <summary>Настройки подключения к БД</summary>
                <div class="form-group">
                    <label for="dbname">Имя базы данных</label>
                    <input type="text" id="dbname" name="dbname"
                           value="{{ db_name }}">
                </div>
                <div class="form-group">
                    <label for="host">Хост</label>
                    <input type="text" id="host" name="host"
                           value="{{ db_host }}">
                </div>
                <div class="form-group">
                    <label for="port">Порт</label>
                    <input type="text" id="port" name="port"
                           value="{{ db_port }}">
                </div>
            </details>

            <button type="submit" class="btn btn-primary btn-full">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
