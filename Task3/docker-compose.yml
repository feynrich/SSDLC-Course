# docker-compose.yml
version: '3.8'

services:
  postgres:
    build: postgres_ru/
    container_name: library_pg17ru
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_app
    environment:
      - DB_NAME=library_db
      - DB_USER=library_user
      - DB_PASSWORD=user_password123
      - DB_HOST=postgres
      - DB_PORT=5432
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - library_network
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  library_network:
    driver: bridge